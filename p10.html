<!DOCTYPE html>
<html>
<head>
    <title>iframe anchor</title>
    <style>
        body{font-family:arial
        }
        a{margin:5px;
            padding:5px;
            background:lightgray;
            text-decoration:none;
            color:black}
        iframe{width:80%;
            height:400px;
            border:1px solid black}
    </style>
</head>
<body>
    <h2>iframe using anchor</h2>
    <div>
        <a href="https://www.wikipedia.org" target="f">Wikipedia</a>
        <a href="https://www.google.com/maps?q=SB%20Jain%20Institute%20Nagpur&output=embed" target="f">Map</a>
        <a href="https://www.youtube.com/embed/ZVgHPSyEIqk" target="f">Youtube</a>
    </div>
    <iframe name="f" src="https://www.wikipedia.org"></iframe>
    <footer>
        <p>practical iframe</p>
        <p>Name:Yash R. Choudhari <br>
            USN : CS25061</p>
    </footer>
</body>
</html>
